<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Дурак онлайн</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--cw:72px;--ch:100px;--felt:#0f5c3a;--felt2:#0a4229;--gold:#f2c14e;--txt:#f4f1e8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:system-ui,Segoe UI,Roboto,sans-serif;color:var(--txt);background:radial-gradient(ellipse at center,var(--felt) 0%,var(--felt2) 100%);overflow:hidden}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 16px;background:var(--gold);color:#222;font-weight:600}
button.sec{background:#ffffff22;color:var(--txt)}
button:disabled{opacity:.4;cursor:default}
input,select{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid #ffffff44;background:#00000033;color:var(--txt)}
select option{color:#222}
.screen{position:absolute;left:0;right:0;top:0;height:100vh;height:100dvh;display:none;flex-direction:column}
#menu,#lobby{overflow-y:auto;justify-content:flex-start;padding-top:max(20px,8vh)}
button,.card{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.screen.on{display:flex}
.center{align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center}
h1{margin:0;font-size:40px;letter-spacing:1px}
.panel{background:#00000040;border:1px solid #ffffff22;border-radius:16px;padding:18px 22px;max-width:560px;width:100%;text-align:left}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
.row label{min-width:170px;opacity:.85}
.seat{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-radius:8px;background:#ffffff10;margin:4px 0}
.link{display:flex;gap:8px}.link input{flex:1;min-width:0}
.muted{opacity:.7;font-size:13px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:#4caf50}.dot.off{background:#e53935}
/* game */
#game{padding:8px}
#top{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;min-height:120px}
.opp{background:#00000030;border-radius:12px;padding:6px 10px;min-width:120px;text-align:center;border:2px solid transparent;position:relative}
.opp.att{border-color:#f2c14e}.opp.def{border-color:#ef5350}
.opp .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.opp .backs{display:flex;justify-content:center;height:52px;margin-top:4px}
.opp .backs img,.opp .backs .cb{width:36px;height:50px;margin-left:-24px;border-radius:4px}
.opp .backs :first-child{margin-left:0}
.tag{font-size:11px;padding:1px 7px;border-radius:8px;background:#ffffff22;display:inline-block;margin-top:3px}
.tag.att{background:#f2c14e;color:#222}.tag.def{background:#ef5350}.tag.pass{background:#78909c}.tag.win{background:#4caf50}
#mid{flex:1;display:flex;align-items:center;gap:20px;padding:10px;min-height:0}
#deckbox{width:calc(var(--cw)*2.1);position:relative;height:var(--ch);flex-shrink:0}
#deckbox .trump{position:absolute;left:calc(var(--cw)*.75);top:0;transform:rotate(90deg)}
#deckbox .stack{position:absolute;left:0;top:0}
#deckbox .cnt{position:absolute;left:8px;top:calc(var(--ch) + 6px);font-size:13px;opacity:.85;white-space:nowrap}
#deckbox .suitbig{font-size:54px;position:absolute;left:20px;top:10px}
#table{flex:1;display:flex;flex-wrap:wrap;gap:22px 30px;align-content:center;justify-content:center;min-height:calc(var(--ch) + 30px)}
.pair{position:relative;width:calc(var(--cw) + 18px);height:calc(var(--ch) + 22px)}
.pair .a{position:absolute;left:0;top:0}
.pair .d{position:absolute;left:18px;top:22px}
.pair.target .a{box-shadow:0 0 0 3px #4fc3f7,0 0 18px #4fc3f7;cursor:pointer}
#right{width:190px;flex-shrink:0;font-size:12px;opacity:.85;align-self:stretch;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
#right div{padding:2px 0;border-bottom:1px solid #ffffff10}
#status{text-align:center;font-size:17px;font-weight:600;min-height:26px}
#actions{display:flex;justify-content:center;gap:10px;min-height:42px;flex-wrap:wrap;margin:4px 0}
#hand{display:flex;justify-content:center;padding:10px 10px 18px;min-height:calc(var(--ch) + 34px)}
#hand .card{margin-left:-26px;transition:transform .12s}
#hand .card:first-child{margin-left:0}
#hand .card.ok{cursor:pointer}
#hand .card.ok:hover{transform:translateY(-14px)}
#hand .card.dim{filter:brightness(.6)}
#hand .card.sel{transform:translateY(-22px);box-shadow:0 0 0 3px #4fc3f7}
.card{width:var(--cw);height:var(--ch);border-radius:7px;background:#fff;box-shadow:0 2px 6px #0007;position:relative;flex-shrink:0;overflow:hidden;user-select:none}
.card img{width:100%;height:100%;display:block;pointer-events:none}
.card.fb{display:flex;flex-direction:column;justify-content:space-between;padding:4px 6px;font-weight:700;font-size:20px;color:#222}
.card.fb.red{color:#c62828}
.card.fb span:last-child{align-self:flex-end;transform:rotate(180deg)}
.card.fb .mid{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:36px}
.cb{background:repeating-linear-gradient(45deg,#1b3d8f,#1b3d8f 4px,#2a52b8 4px,#2a52b8 8px);border:3px solid #fff;border-radius:7px}
#topbar{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:2px 6px;gap:8px}
#overlay{position:absolute;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:10}
#overlay.on{display:flex}
#overlay{pointer-events:none;background:#0007}#overlay .panel{pointer-events:auto}
#game.over #top{position:relative;z-index:11}
.opp.aim{cursor:crosshair;outline:2px dashed #ff5252;outline-offset:2px}
.opp.aim:hover{outline-color:#fff;transform:scale(1.04)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:45;overflow:hidden}
.fxe{position:fixed;pointer-events:none;line-height:1;will-change:transform}
.runner{position:fixed;pointer-events:auto;cursor:pointer;z-index:46;will-change:transform}
.runner img{height:84px;display:block;animation:bob .28s ease-in-out infinite alternate;user-select:none;-webkit-user-drag:none}
@keyframes bob{to{transform:translateY(-9px) rotate(2deg)}}
#gunBtn.on{background:#ff5252;color:#fff}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#000c;padding:8px 16px;border-radius:10px;display:none;z-index:20}
#topbar{padding-right:270px;min-height:40px}
#tools{position:fixed;top:5px;right:6px;display:flex;gap:5px;z-index:25}
.tb{width:38px;height:36px;padding:0;font-size:18px;background:#00000055;color:#fff;border:1px solid #ffffff33;position:relative}
.tb.off{opacity:.45;text-decoration:line-through}
#tMusic.off::after{content:'';position:absolute;left:6px;right:6px;top:50%;height:2px;background:#ef5350;transform:rotate(-35deg)}
#tChat[data-badge]:not([data-badge=""])::after{content:attr(data-badge);position:absolute;top:-6px;right:-6px;background:#ef5350;border-radius:9px;font-size:11px;min-width:18px;height:18px;line-height:18px}
#chat{position:fixed;right:8px;top:48px;width:310px;max-height:min(60vh,460px);background:#0b2e1fee;border:1px solid #ffffff33;border-radius:14px;display:none;flex-direction:column;z-index:30;padding:8px;gap:6px;box-shadow:0 8px 30px #0008}
#chat.on{display:flex}
.chHead{display:flex;align-items:center;gap:8px}.chHead .muted{flex:1;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chHead button{padding:3px 9px}
#chatLog{flex:1;overflow-y:auto;font-size:14px;min-height:80px;word-wrap:break-word}
#chatLog div{padding:3px 2px;border-bottom:1px solid #ffffff12}
#chatReacts{display:flex;gap:4px;flex-wrap:wrap}#chatReacts button{padding:4px 7px;font-size:18px}
#chatForm{display:flex;gap:6px}#chatForm input{flex:1;min-width:0}#chatForm button{padding:6px 12px}
#musicPanel{position:fixed;right:8px;top:48px;width:290px;background:#0b2e1fee;border:1px solid #ffffff33;border-radius:14px;display:none;flex-direction:column;z-index:31;padding:12px;gap:10px;box-shadow:0 8px 30px #0008}
#musicPanel.on{display:flex}
#musicPanel label{display:flex;align-items:center;gap:8px;font-size:14px}
#musicPanel input[type=range]{flex:1;accent-color:var(--gold);padding:0;border:0;background:none}
#musicPanel .val{width:38px;text-align:right;font-size:13px;opacity:.8}
#mpTrack{font-size:12px;opacity:.8;min-height:16px}
@media (max-width:700px){#topbar{padding-right:0;padding-top:44px;min-height:0}#chat,#musicPanel{left:6px;right:6px;width:auto;top:46px}}
/* polish */
body{background:radial-gradient(ellipse at 50% 45%,#16774b 0%,#0d5534 45%,#062c1b 100%)}
#game::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.07;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:4px 4px}
.opp{display:flex;flex-direction:column;align-items:center;transition:border-color .3s,box-shadow .3s}
.opp.att{box-shadow:0 0 18px #f2c14e66}.opp.def{box-shadow:0 0 18px #ef535066}
.av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:#fff;border:2px solid #ffffff88;margin-bottom:2px}
.opp.att .av,.opp.def .av{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12);box-shadow:0 0 14px #fff8}}
.pair{transition:transform .2s}
.pair .card{box-shadow:0 4px 12px #0009}
#table.drop{outline:3px dashed #ffffff55;outline-offset:6px;border-radius:16px}
.pair.target.hov .a,.pair.cheatT.hov .a{box-shadow:0 0 0 4px #fff,0 0 24px #4fc3f7}
.pair.cheatT .a{box-shadow:0 0 0 3px #ff9800,0 0 18px #ff9800;cursor:pointer}
.card.catchable{box-shadow:0 0 0 3px #e53935,0 0 18px #e53935;cursor:crosshair;animation:wig .5s ease-in-out infinite}
@keyframes wig{50%{transform:rotate(3deg)}}
#hand .card{touch-action:none;cursor:grab}
#hand .card.cheat{box-shadow:0 0 0 2px #ff9800aa}
#status{display:flex;justify-content:center}
#status span{background:#00000055;padding:4px 16px;border-radius:20px}
#status span.me{background:#f2c14e;color:#222;animation:pulse 1.6s ease-in-out infinite}
.dragG{position:fixed;margin:0!important;z-index:60;pointer-events:none;transform:rotate(-5deg) scale(1.1);box-shadow:0 16px 34px #000b!important}
.fly{position:fixed;z-index:55;pointer-events:none;margin:0!important}
@media (hover:none){#hand .card.ok:hover{transform:none}#hand .card.ok{transform:translateY(-8px)}}
@media (max-width:700px){:root{--cw:56px;--ch:79px}#right{display:none}#mid{gap:8px}h1{font-size:30px}.row label{min-width:120px}}
</style>
</head>
<body>

<div id="menu" class="screen center">
  <h1>🃏 Дурак онлайн</h1>
  <div class="panel">
    <div class="row"><label>Ваше имя</label><input id="name" maxlength="16" placeholder="Игрок"></div>
    <div class="row" id="menuBtns">
      <button id="btnCreate">Создать игру</button>
      <button id="btnResume" class="sec" style="display:none">Вернуться в свою игру</button>
    </div>
    <div class="row" id="joinRow" style="display:none"><button id="btnJoin">Присоединиться к игре <b id="joinCode"></b></button></div>
    <p class="muted">Создайте игру, скопируйте ссылку-приглашение и отправьте другу. Можно добавить ботов или сыграть с ботами одному.</p>
  </div>
</div>

<div id="lobby" class="screen center">
  <h1>Комната <span id="lCode"></span></h1>
  <div class="panel">
    <div class="muted">Ссылка-приглашение:</div>
    <div class="link"><input id="lLink" readonly><button id="btnCopy">Копировать</button></div>
    <div id="lNet" class="muted" style="margin-top:6px"></div>
    <h3 style="margin:14px 0 6px">Настройки</h3>
    <div class="row"><label>Режим</label><select id="oMode"><option value="podkidnoy">Подкидной</option><option value="perevodnoy">Переводной</option></select></div>
    <div class="row"><label>Колода</label><select id="oDeck"><option value="36">36 карт</option><option value="24">24 карты</option><option value="52">52 карты</option></select></div>
    <div class="row"><label>Подкидывают</label><select id="oThrow"><option value="all">Все игроки</option><option value="neighbors">Только соседи</option></select></div>
    <div class="row"><label>Боты</label><select id="oBots"><option value="smart">Умные (считают карты)</option><option value="easy">Простые</option></select></div>
    <div class="row"><label>Командная игра</label><select id="oTeams"><option value="0">Каждый за себя</option><option value="1">Команды (2×2 / 3×3)</option></select></div>
    <div class="row"><label><input type="checkbox" id="oFirst5"> Первый отбой — не больше 5 карт</label></div>
    <div class="row"><label><input type="checkbox" id="oShow"> Перевод показом козыря (переводной)</label></div>
    <div class="row"><label><input type="checkbox" id="oCheat"> 🃏 Шулер: можно мухлевать (бить и подкидывать любыми картами), соперники могут поймать</label></div>
    <h3 style="margin:14px 0 6px">Приколы</h3>
    <div class="row"><label><input type="checkbox" id="oTomato"> 🍅 Помидоры: после партии можно кидаться в соперников</label></div>
    <div class="row"><label><input type="checkbox" id="oPistol"> 🔫 Пистолет: дурак получает его в следующей партии (3 выстрела)</label></div>
    <div class="row"><label><input type="checkbox" id="oRunner"> 🐱 Иногда по столу пробегает котик</label></div>
    <div class="row"><label>Своя картинка бегуна</label><input id="oRunnerImg" maxlength="400" placeholder="https://…/картинка.png (необязательно)" style="flex:1;min-width:0"></div>
    <h3 style="margin:14px 0 6px">Игроки <span id="lCount" class="muted"></span></h3>
    <div id="lSeats"></div>
    <div class="row" id="hostBtns">
      <button class="sec" id="btnBot">+ Бот</button>
      <button id="btnStart">Начать игру</button>
    </div>
    <div id="lWait" class="muted"></div>
  </div>
</div>

<div id="game" class="screen">
  <div id="topbar"><span id="gInfo"></span></div>
  <div id="top"></div>
  <div id="mid"><div id="deckbox"></div><div id="table"></div><div id="right"></div></div>
  <div id="status"></div>
  <div id="actions"></div>
  <div id="hand"></div>
  <div id="overlay"><div class="panel" style="text-align:center" id="ovBody"></div></div>
</div>
<div id="toast"></div>
<div id="fx"></div>
<div id="tools">
  <button class="tb" id="tMusic" title="Музыка">🎵</button>
  <button class="tb" id="tSound" title="Звуки">🔊</button>
  <button class="tb" id="tChat" title="Чат">💬</button>
  <button class="tb" id="tLink" title="Ссылка-приглашение">🔗</button>
  <button class="tb" id="tLeave" title="Выйти">🚪</button>
</div>
<div id="musicPanel">
  <div class="chHead"><b>Музыка и звук</b><span></span><button class="sec" id="mpClose">✕</button></div>
  <label><input type="checkbox" id="mpOn"> Музыка включена</label>
  <label>🎵 <input type="range" id="mpVol" min="0" max="100" step="1"><span class="val" id="mpVolV"></span></label>
  <label><input type="checkbox" id="mpSndOn"> Звуки игры</label>
  <label>🔊 <input type="range" id="mpSnd" min="0" max="100" step="1"><span class="val" id="mpSndV"></span></label>
  <label><input type="checkbox" id="mpAnim"> Анимации карт</label>
  <label><input type="checkbox" id="mpFun"> Показывать приколы (помидоры, пистолет, котик)</label>
  <div class="row" style="margin:0"><button class="sec" id="mpPrev">⏮</button><button class="sec" id="mpPlay">⏯</button><button class="sec" id="mpNext">⏭ Следующий</button></div>
  <div id="mpTrack"></div>
  <div class="muted" id="mpIos" style="display:none">На iPhone громкость музыки меняется только кнопками телефона — это ограничение iOS.</div>
</div>
<div id="chat">
  <div class="chHead"><b>Чат</b><span id="trackName" class="muted"></span><button class="sec" id="chatClose">✕</button></div>
  <div id="chatLog"></div>
  <div id="chatReacts"></div>
  <form id="chatForm"><input id="chatIn" maxlength="200" placeholder="Сообщение…" autocomplete="off"><button>➤</button></form>
</div>

<script>
"use strict";
/* ===================== helpers ===================== */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SYM = {S:'♠',C:'♣',D:'♦',H:'♥'};
const RN = {11:'В',12:'Д',13:'К',14:'Т'};
const suit = c => c[0], rank = c => +c.slice(1);
const cname = c => (RN[rank(c)] || rank(c)) + SYM[suit(c)];
const API_R = {10:'0',11:'J',12:'Q',13:'K',14:'A'};
const imgUrl = c => `https://deckofcardsapi.com/static/img/${API_R[rank(c)] || rank(c)}${suit(c)}.png`;
const BACK = 'https://deckofcardsapi.com/static/img/back.png';
const rnd = n => Math.floor(Math.random()*n);
function crnd(n){const c=globalThis.crypto;if(!c||!c.getRandomValues)return rnd(n);const lim=Math.floor(4294967296/n)*n,b=new Uint32Array(1);do c.getRandomValues(b);while(b[0]>=lim);return b[0]%n}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=crnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function toast(t){const el=$('toast');el.textContent=t;el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display='none',2200)}
const PEER_PREFIX = 'durak-onl-v1-';
const MAXP = {24:4,36:6,52:6};

/* ===================== game engine (host only) ===================== */
function makeDeck(size){const min=size==24?9:size==36?6:2;const d=[];for(const s of 'SCDH')for(let r=min;r<=14;r++)d.push(s+r);return d}
function beats(d,a,tr){return (suit(d)===suit(a)&&rank(d)>rank(a))||(suit(d)===tr&&suit(a)!==tr)}
function nextActive(g,i,f){const n=g.players.length;for(let k=1;k<=n;k++){const j=(i+k)%n;const p=g.players[j];if(!p.out&&(!f||f(j)))return j}return -1}
function opp(g,i){return j=>!g.opts.teams||g.players[j].team!==g.players[i].team}
function cap(g){return g.firstBout&&g.opts.first5?5:6}
function sortHand(h,tr){return h.slice().sort((x,y)=>((suit(x)===tr)-(suit(y)===tr))||'SCDH'.indexOf(suit(x))-'SCDH'.indexOf(suit(y))||rank(x)-rank(y))}
function log(g,t){g.log.push(t);if(g.log.length>40)g.log.shift()}
function mem(g){if(!g.known)g.known=g.players.map(()=>[]);if(!g.gone)g.gone=[];return g}
function forget(g,c){mem(g);for(const k of g.known){const j=k.indexOf(c);if(j>=0)k.splice(j,1)}}
function remember(g,i,c){mem(g);if(!g.known[i].includes(c))g.known[i].push(c)}
function ev(g,type,o){g.evSeq=(g.evSeq||0)+1;(g.evs=g.evs||[]).push({id:g.evSeq,type,...o});if(g.evs.length>12)g.evs.shift()}

function newGame(seats,opts){
  const deck=shuffle(makeDeck(+opts.deck));
  const g={opts:{...opts,deck:+opts.deck},players:seats.map((s,i)=>({name:s.name,isBot:!!s.isBot,hand:[],out:false,place:0,team:i%2})),
    deck,discard:0,table:[],log:[],firstBout:true,taking:false,passed:[],shown:[],over:false,result:null,outCount:0};
  for(let r=0;r<6;r++)for(const p of g.players)if(g.deck.length)p.hand.push(g.deck.shift());
  if(g.deck.length){g.trumpCard=g.deck[g.deck.length-1]}else{const lp=g.players[g.players.length-1];g.trumpCard=lp.hand[lp.hand.length-1]}
  g.trump=suit(g.trumpCard);
  let best=-1,br=99;g.players.forEach((p,i)=>p.hand.forEach(c=>{if(suit(c)===g.trump&&rank(c)<br){br=rank(c);best=i}}));
  if(best<0)best=rnd(g.players.length);
  log(g,`Козырь: ${SYM[g.trump]}. Первым ходит ${g.players[best].name}`+(br<99?` (младший козырь)`:''));
  g.gid=Math.random().toString(36).slice(2);ev(g,'start',{});mem(g);
  if(!g.deck.length)remember(g,g.players.length-1,g.trumpCard);
  startBout(g,best);
  return g;
}
function startBout(g,att){
  g.attacker=att;g.defender=nextActive(g,att,opp(g,att));
  g.table=[];g.taking=false;g.passed=[];g.shown=[];g.cheats=[];g.blocked=[];g.noAccuse=[];g.tried=[];
  g.limit=Math.min(cap(g),g.players[g.defender].hand.length);
}
function eligible(g,i){

let peer=null,conn=null;
let botTimer=null;
const ME={name:localStorage.getItem('durak_name')||'',token:localStorage.getItem('durak_token')||(Math.random().toString(36).slice(2)+Date.now().toString(36))};
localStorage.setItem('durak_token',ME.token);
const BOTN=['Бот Вася','Бот Маша','Бот Петя','Бот Оля','Бот Гриша','Бот Нина'];
const defOpts=()=>({mode:'podkidnoy',deck:36,throwIn:'all',teams:0,first5:false,trumpShow:false,cheat:0,bots:'smart',tomatoes:1,pistol:1,runner:1,runnerImg:''});
function saveHost(){if(!H)return;const s={code:H.code,opts:H.opts,seats:H.seats.map(x=>({name:x.name,isBot:x.isBot,token:x.token})),game:H.game,chat:H.chat};localStorage.setItem('durak_host',JSON.stringify(s))}
function loadHost(){try{return JSON.parse(localStorage.getItem('durak_host'))}catch(e){return null}}
function newCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<6;i++)s+=A[rnd(A.length)];return s}

function startHost(saved){
  H=saved?{code:saved.code,opts:saved.opts,seats:saved.seats.map(s=>({...s,conn:null})),game:saved.game}
         :{code:newCode(),opts:defOpts(),seats:[{name:ME.name,isBot:false,token:'host'}],game:null};
  H.chat=(saved&&saved.chat)||[];
  H.seats[0].name=ME.name;if(H.game)H.game.players[0].name=ME.name;
  S.role='host';S.code=H.code;location.hash=H.code;
  H.fxNonce=Math.random().toString(36).slice(2);H.fx=[];
  saveHost();openPeer();broadcast();scheduleBots();runnerLoop();
}
function openPeer(){
  if(typeof Peer==='undefined'){S.net='Сетевая библиотека не загрузилась — доступна только игра с ботами';render();return}
  S.net='Подключение к сети…';
  peer=new Peer(PEER_PREFIX+H.code);
  peer.on('open',()=>{S.net='Онлайн: друзья могут подключаться по ссылке';render()});
  peer.on('error',e=>{
    if(e.type==='unavailable-id'&&!H.game&&H.seats.length===1){peer.destroy();H.code=newCode();S.code=H.code;location.hash=H.code;saveHost();openPeer();return}
    if(['unavailable-id','network','server-error','socket-error','socket-closed'].includes(e.type)){
      S.net='Переподключение к сети…';render();try{peer.destroy()}catch(_){}
      clearTimeout(openPeer.t);openPeer.t=setTimeout(openPeer,e.type==='unavailable-id'?4000:3000);return}
    S.net='Ошибка сети: '+e.type;render()});
  peer.on('disconnected',()=>{S.net='Переподключение…';render();const p=peer;setTimeout(()=>{if(p===peer&&!p.destroyed)try{p.reconnect()}catch(e){}},2000)});
  peer.on('connection',c=>{
    c.on('data',m=>hostMsg(c,m));
    c.on('close',()=>{const s=H.seats.find(s=>s.conn===c);if(s){s.conn=null;broadcast()}});
  });
}
function hostMsg(c,m){
  if(!m||typeof m!=='object')return;
  if(m.t==='hello'){
    const name=String(m.name||'Гость').slice(0,16),tok=String(m.token||'').slice(0,40);
    let k=H.seats.findIndex(s=>s.token===tok&&!s.isBot);
    if(k<0){
      if(H.game){c.send({t:'err',msg:'Игра уже идёт'});return}
      if(H.seats.length>=MAXP[H.opts.deck]){c.send({t:'err',msg:'Комната заполнена'});return}
      H.seats.push({name,isBot:false,token:tok,conn:c});k=H.seats.length-1;
    }else{H.seats[k].conn=c;H.seats[k].name=name;if(H.game)H.game.players[k].name=name}
    saveHost();broadcast();return;
  }
  if(m.t==='act'){const k=H.seats.findIndex(s=>s.conn===c);if(k>=0)hostAct(k,m.a)}
  if(m.t==='chat'){const k=H.seats.findIndex(s=>s.conn===c);if(k>=0)hostChat(k,m)}
  if(m.t==='fx'){const k=H.seats.findIndex(s=>s.conn===c);if(k>=0)hostFx(k,m)}
}
const REACTS=['chicken','boom','clown','horn','duck','boing'];
function hostChat(k,m){
  const now=Date.now(),s=H.seats[k];if(s._lc&&now-s._lc<400)return;s._lc=now;
  const text=String(m.text||'').replace(/\s+/g,' ').trim().slice(0,200),react=REACTS.includes(m.react)?m.react:null;
  if(!text&&!react)return;
  const last=H.chat[H.chat.length-1];
  H.chat.push({id:(last?last.id:0)+1,name:s.name,who:k,text,react});if(H.chat.length>40)H.chat.shift();
  saveHost();broadcast();
}
function seatInfo(){return H.seats.map(s=>({name:s.name,isBot:s.isBot,online:s.isBot||s.token==='host'||!!s.conn}))}
function viewFor(g,i){
  const p=g.players[i];
  return{me:i,players:g.players.map((q,k)=>({name:q.name,count:q.hand.length,out:q.out,place:q.place,team:q.team,isBot:q.isBot})),
    hand:sortHand(p.hand,g.trump),deck:g.deck.length,trump:g.trump,trumpCard:g.trumpCard,table:g.table,attacker:g.attacker,defender:g.defender,
    taking:g.taking,passed:g.passed,discard:g.discard,log:g.log.slice(-14),over:g.over,result:g.result,opts:g.opts,legal:legalFor(g,i),
    eligible:g.players.map((_,k)=>eligible(g,k)),gid:g.gid||'old',evs:g.evs||[],known:mem(g).known.map((k,j)=>j===i?[]:k),gone:g.gone,limit:g.limit,ammo:g.ammo||{}};
}
function msgFor(i){return{t:'state',code:H.code,opts:H.opts,seats:seatInfo(),you:i,view:H.game?viewFor(H.game,i):null,chat:H.chat,fx:{n:H.fxNonce,list:H.fx||[]}}}
function broadcast(){
  H.seats.forEach((s,i)=>{if(s.conn&&s.conn.open)try{s.conn.send(msgFor(i))}catch(e){}});
  onState(msgFor(0));
}
function hostAct(i,a){
  if(!a||typeof a!=='object')return;
  if(a.type==='lobby'){if(i!==0||H.game&&!H.game.over&&a.op!=='toBot')return;lobbyOp(a);saveHost();broadcast();scheduleBots();return}
  if(!H.game)return;
  if(act(H.game,i,a)){saveHost();broadcast();hostAfter();scheduleBots()}
}
function lobbyOp(a){
  if(a.op==='opt'){const o={...H.opts};if(['mode','throwIn'].includes(a.k))o[a.k]=String(a.v);if(a.k==='bots')o.bots=a.v==='easy'?'easy':'smart';if(a.k==='deck')o.deck=+a.v;if(['teams','first5','trumpShow','cheat','tomatoes','pistol','runner'].includes(a.k))o[a.k]=a.v?1:0;
    if(a.k==='runnerImg'){const u=String(a.v||'').trim();o.runnerImg=/^https:\/\/[^\s"'<>]+$/.test(u)&&u.length<=400?u:''}H.opts=o}
  if(a.op==='bot'&&H.seats.length<MAXP[H.opts.deck]){const used=H.seats.map(s=>s.name);H.seats.push({name:BOTN.find(n=>!used.includes(n))||'Бот',isBot:true,token:'bot'+Math.random()})}
  if(a.op==='kick'&&a.i>0&&a.i<H.seats.length){const s=H.seats[a.i];if(s.conn){try{s.conn.send({t:'err',msg:'Вас убрали из комнаты'});s.conn.close()}catch(e){}}H.seats.splice(a.i,1)}
  if(a.op==='toBot'&&H.game&&a.i>0){H.seats[a.i].isBot=true;H.game.players[a.i].isBot=true;H.seats[a.i].name=H.game.players[a.i].name+' (бот)';H.game.players[a.i].name=H.seats[a.i].name}
  if(a.op==='start'){
    const n=H.seats.length;if(n<2)return toast('Нужно минимум 2 игрока');
    if(n>MAXP[H.opts.deck])return toast('Слишком много игроков для этой колоды');
    if(H.opts.teams&&n!==4&&n!==6)return toast('Командная игра — 4 или 6 игроков');
    const lt=H.game&&H.game.over?loserTokens(H.game):(H.lastLosers||[]);
    H.game=newGame(H.seats,H.opts);H.lastLosers=[];
    if(H.opts.pistol&&lt.length){H.game.ammo={};H.seats.forEach((s,i)=>{if(lt.includes(s.token))H.game.ammo[i]=3})}
  }
  if(a.op==='lobby'){if(H.game&&H.game.over)H.lastLosers=loserTokens(H.game);H.game=null}
}
function losersIdx(g){const r=g.result||{};if(r.loser!=null)return[r.loser];if(r.loserTeam!=null)return g.players.map((p,i)=>i).filter(i=>g.players[i].team===r.loserTeam);return[]}
function loserTokens(g){return losersIdx(g).map(i=>H.seats[i]&&H.seats[i].token).filter(Boolean)}
function hostAfter(){
  const g=H.game;if(!g||!g.over||g._overDone)return;g._overDone=1;H.lastLosers=loserTokens(g);
  if(!g.opts.tomatoes)return;const L=losersIdx(g);
  g.players.forEach((p,i)=>{if(!p.isBot)return;const tg=L.includes(i)?g.players.map((_,j)=>j).filter(j=>j!==i&&!L.includes(j)):L;if(!tg.length)return;
    const n=1+rnd(3);for(let j=0;j<n;j++)setTimeout(()=>hostFx(i,{kind:'tomato',target:R(tg)}),1200+j*800+rnd(1500))});
}
function pushFx(o){H.fxSeq=(H.fxSeq||0)+1;(H.fx=H.fx||[]).push({id:H.fxSeq,...o});if(H.fx.length>15)H.fx.shift();broadcast()}
function hostFx(k,m){
  const g=H&&H.game;if(!g||!m)return;const s=H.seats[k],now=Date.now();if(!s||s._lf&&now-s._lf<350)return;
  const t=+m.target;if(!(t>=0&&t<g.players.length)||t===k)return;
  if(m.kind==='tomato'){if(!g.over||!g.opts.tomatoes)return;s._lf=now}
  else if(m.kind==='shot'){if(g.over||!g.opts.pistol||!g.ammo||!(g.ammo[k]>0))return;s._lf=now;g.ammo[k]--;saveHost()}
  else return;
  pushFx({kind:m.kind,from:k,target:t});
}
function runnerLoop(){clearTimeout(runnerLoop.t);runnerLoop.t=setTimeout(()=>{const g=H&&H.game;
  if(g&&!g.over&&g.opts.runner)pushFx({kind:'runner',y:Math.random(),dir:Math.random()<.5?1:-1,speed:5500+rnd(3500)});runnerLoop()},18000+rnd(30000))}
function scheduleBots(){
  clearTimeout(botTimer);const g=H&&H.game;if(!g||g.over)return;
  botTimer=setTimeout(()=>{
    const n=g.players.length,order=[g.defender,g.attacker];for(let k=0;k<n;k++)if(!order.includes(k))order.push(k);
    for(const i of order){if(i<0||!g.players[i].isBot||g.players[i].out)continue;
      const a=g.opts.bots==='easy'?botAct(g,i):smartBot(g,i);if(a&&act(g,i,a)){saveHost();broadcast();hostAfter();
        if(g.ammo&&g.ammo[i]>0&&!g.over&&Math.random()<.07){const tg=g.players.map((_,j)=>j).filter(j=>j!==i);setTimeout(()=>hostFx(i,{kind:'shot',target:R(tg)}),500)}
        scheduleBots();return}}
  },g.opts.bots==='easy'?750:600);
}

/* ===================== guest ===================== */
function startGuest(code){
  S.role='guest';S.code=code;S.net='Подключение к комнате…';render();
  if(typeof Peer==='undefined'){S.net='Сетевая библиотека не загрузилась';render();return}
  guestPeer();
}
function guestPeer(){
  try{peer&&peer.destroy()}catch(_){}
  peer=new Peer();
  peer.on('open',connect);
  peer.on('disconnected',()=>{const p=peer;setTimeout(()=>{if(p===peer&&!p.destroyed)try{p.reconnect()}catch(e){}},2000)});
  peer.on('error',e=>{
    if(e.type==='peer-unavailable'){S.net='Комната не найдена или хозяин офлайн. Повтор…';render();retryConnect(4000)}
    else{S.net='Ошибка сети, переподключение…';render();clearTimeout(guestPeer.t);guestPeer.t=setTimeout(guestPeer,4000)}});
}
function retryConnect(ms){clearTimeout(connect.t);connect.t=setTimeout(connect,ms)}
function connect(){
  if(conn&&conn.open)return;
  if(!peer||peer.destroyed||peer.disconnected){retryConnect(2000);return}
  const c=peer.connect(PEER_PREFIX+S.code,{reliable:true});conn=c;
  c.on('open',()=>{if(conn!==c)return;S.net='Подключено';c.send({t:'hello',name:ME.name,token:ME.token});render()});
  c.on('data',m=>{if(conn!==c)return;if(m&&m.t==='state')onState(m);else if(m&&m.t==='err'){toast(m.msg);S.net=m.msg;render()}});
  c.on('close',()=>{if(conn!==c)return;S.net='Связь потеряна. Переподключение…';render();retryConnect(3000)});
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.role==='guest'&&!(conn&&conn.open))retryConnect(300)});
function send(a){if(S.role==='host')hostAct(0,a);else if(conn&&conn.open)conn.send({t:'act',a});else toast('Нет связи с хозяином')}

/* ===================== UI ===================== */
const S={role:null,code:null,msg:null,net:'',sel:null};
function onState(m){S.msg=m;if(S.sel&&!(m.view&&m.view.hand.includes(S.sel)))S.sel=null;render();try{processIncoming(m)}catch(e){console.error(e)}try{processFx(m)}catch(e){console.error(e)}}
function show(id){for(const s of['menu','lobby','game'])$(s).classList.toggle('on',s===id)}
function inviteLink(){return location.origin+location.pathname+'#'+S.code}
function copyLink(){const l=inviteLink();(navigator.clipboard?navigator.clipboard.writeText(l):Promise.reject()).then(()=>toast('Ссылка скопирована — отправьте другу'),()=>{prompt('Скопируйте ссылку:',l)})}

function cardEl(c,cls=''){
  const d=document.createElement('div');d.className='card '+cls;d.dataset.c=c;
  const im=new Image();im.src=imgUrl(c);im.alt=cname(c);im.draggable=false;
  im.onerror=()=>{d.innerHTML='';d.classList.add('fb');if('DH'.includes(suit(c)))d.classList.add('red');
    const r=RN[rank(c)]||rank(c);d.innerHTML=`<span>${r}${SYM[suit(c)]}</span><div class="mid">${SYM[suit(c)]}</div><span>${r}${SYM[suit(c)]}</span>`};
  d.appendChild(im);return d;
}
function backEl(){const im=new Image();im.src=BACK;im.className='bk';im.draggable=false;im.onerror=()=>{const d=document.createElement('div');d.className='cb '+im.className.replace('bk','');im.replaceWith(d)};return im}

function render(){
  const m=S.msg;renderTools();
  if(!S.role){show('menu');return}
  if(!m||!m.view){renderLobby(m);return}
  renderGame(m);
}
function renderLobby(m){
  show('lobby');
  $('lCode').textContent=S.code||'';$('lLink').value=inviteLink();$('lNet').textContent=S.net||'';
  const host=S.role==='host';
  if(!m){$('lSeats').innerHTML='';$('hostBtns').style.display='none';$('lWait').textContent='';return}
  for(const[id,k]of[['oMode','mode'],['oDeck','deck'],['oThrow','throwIn'],['oTeams','teams']]){$(id).value=String(m.opts[k]);$(id).disabled=!host}
  $('oBots').value=m.opts.bots==='easy'?'easy':'smart';$('oBots').disabled=!host;
  for(const[id,k]of[['oTomato','tomatoes'],['oPistol','pistol'],['oRunner','runner']]){$(id).checked=!!m.opts[k];$(id).disabled=!host}
  if(document.activeElement!==$('oRunnerImg'))$('oRunnerImg').value=m.opts.runnerImg||'';$('oRunnerImg').disabled=!host;
  $('oFirst5').checked=!!m.opts.first5;$('oShow').checked=!!m.opts.trumpShow;$('oCheat').checked=!!m.opts.cheat;$('oFirst5').disabled=$('oShow').disabled=$('oCheat').disabled=!host;
  $('lCount').textContent=`${m.seats.length}/${MAXP[m.opts.deck]}`;
  $('lSeats').innerHTML=m.seats.map((s,i)=>`<div class="seat"><span><span class="dot ${s.online?'':'off'}"></span>${esc(s.name)}${i===0?' 👑':''}${i===m.you?' (вы)':''}${m.opts.teams?` <span class="tag">команда ${i%2+1}</span>`:''}</span>${host&&i>0?`<button class="sec" data-kick="${i}" style="padding:3px 9px">✕</button>`:''}</div>`).join('');
  $('hostBtns').style.display=host?'flex':'none';
  $('lWait').textContent=host?'Отправьте ссылку другу, дождитесь его появления в списке и нажмите «Начать игру».':'Ждём, пока хозяин начнёт игру…';
}
function roleOf(v,i){
  if(v.over)return'';const p=v.players[i];
  if(p.out)return`<span class="tag win">вышел (${p.place})</span>`;
  if(i===v.defender)return`<span class="tag def">${v.taking?'берёт':'отбивается'}</span>`;
  if(i===v.attacker)return`<span class="tag att">ходит</span>`+(v.passed.includes(i)&&v.table.length?' <span class="tag pass">пас</span>':'');
  if(v.passed.includes(i)&&v.table.length&&v.eligible[i])return`<span class="tag pass">пас</span>`;
  return'';
}
function renderGame(m){
  const snap=snapshot();
  show('game');const v=m.view,me=v.me,L=v.legal,n=v.players.length;
  $('game').classList.toggle('over',!!v.over);
  const ammo=(v.ammo||{})[me]||0;if(!ammo||v.over)S.gunMode=false;
  const canTomato=v.over&&v.opts.tomatoes;
  if(!L.catch||!L.catch.length)S.catchMode=false;
  const modeName=(v.opts.mode==='perevodnoy'?'Переводной':'Подкидной')+(v.opts.teams?', командный':'')+(v.opts.cheat?', шулерский':'');
  $('gInfo').innerHTML=`${esc(modeName)} · ${v.opts.deck} карт · Комната ${esc(S.code)} · <span class="muted">${esc(S.net)}</span>`;
  // opponents
  const top=$('top');top.innerHTML='';
  for(let k=1;k<n;k++){const i=(me+k)%n,p=v.players[i],seat=m.seats[i];
    const d=document.createElement('div');d.className='opp'+(i===v.attacker?' att':'')+(i===v.defender?' def':'');d.dataset.i=i;
    d.innerHTML=`<div class="av" style="background:${avColor(p.name)}">${esc((p.name||'?').replace(/^Бот /,'').charAt(0).toUpperCase())}</div><div class="nm">${seat&&!seat.online?'<span class="dot off"></span>':''}${esc(p.name)}${v.opts.teams?(p.team===v.players[me].team?' 🤝':''):''}</div><div class="backs"></div><div>${roleOf(v,i)} <span class="muted">${p.count} карт</span></div>`;
    const b=d.querySelector('.backs');for(let c=0;c<Math.min(p.count,8);c++)b.appendChild(backEl());
    if(S.role==='host'&&seat&&!seat.online&&!p.isBot&&!v.over){const bt=document.createElement('button');bt.className='sec';bt.style.cssText='padding:2px 8px;font-size:11px;margin-top:3px';bt.textContent='заменить ботом';bt.onclick=()=>send({type:'lobby',op:'toBot',i});d.appendChild(bt)}
    if(canTomato||S.gunMode){d.classList.add('aim');d.title=S.gunMode?'Выстрелить':'Кинуть помидор';d.onclick=()=>{if(S.gunMode){S.gunMode=false;sendFx('shot',i);render()}else sendFx('tomato',i)}}
    top.appendChild(d)}
  // deck
  const db=$('deckbox');db.innerHTML='';
  if(v.deck>0){const t=cardEl(v.trumpCard,'trump');db.appendChild(t);if(v.deck>1){const s=backEl();s.classList.add('stack','card');s.style.cssText='width:var(--cw);height:var(--ch);border-radius:7px';db.appendChild(s)}}
  else{const s=document.createElement('div');s.className='suitbig';s.style.color='DH'.includes(v.trump)?'#ef5350':'#fff';s.textContent=SYM[v.trump];db.appendChild(s)}
  const cn=document.createElement('div');cn.className='cnt';cn.innerHTML=`Колода: ${v.deck}<br>Козырь: ${SYM[v.trump]}<br>Бито: ${v.discard}`;db.appendChild(cn);
  // table
  const tb=$('table');tb.innerHTML='';
  const selTargets=S.sel&&L.defend[S.sel]?L.defend[S.sel]:[],honT=S.sel&&L.hDefend&&L.hDefend[S.sel]?L.hDefend[S.sel]:(v.opts.cheat?[]:selTargets);
  v.table.forEach((t,k)=>{const p=document.createElement('div');p.dataset.k=k;
    const isT=selTargets.includes(k);p.className='pair'+(isT?(honT.includes(k)?' target':' cheatT'):'');
    p.style.transform=`rotate(${tilt(t.a)}deg)`;
    const ca=cardEl(t.a,'a');p.appendChild(ca);let cd=null;if(t.d){cd=cardEl(t.d,'d');p.appendChild(cd)}
    if(isT)p.onclick=()=>{send({type:'defend',card:S.sel,idx:k});S.sel=null};
    if(S.catchMode)for(const x of L.catch)if(x.idx===k){const el=x.part==='a'?ca:cd;if(el){el.classList.add('catchable');el.onclick=ev=>{ev.stopPropagation();S.catchMode=false;send({type:'catch',idx:k,part:x.part})}}}
    tb.appendChild(p)});
  if(!v.table.length){const e=document.createElement('div');e.className='muted';e.textContent=v.over?'':'Стол пуст';tb.appendChild(e)}
  $('right').innerHTML=v.log.map(l=>`<div>${esc(l)}</div>`).join('');
  // hand
  const hd=$('hand');hd.innerHTML='';
  const playable=c=>L.throw.includes(c)||!!L.defend[c]||L.transfer.includes(c);
  const anyMove=L.throw.length||Object.keys(L.defend).length||L.transfer.length;
  const honest=c=>!v.opts.cheat||(L.hThrow||[]).includes(c)||!!(L.hDefend||{})[c]||L.transfer.includes(c);
  v.hand.forEach(c=>{const ok=playable(c);const e=cardEl(c,(ok?'ok':(anyMove?'dim':''))+(ok&&!honest(c)?' cheat':'')+(S.sel===c?' sel':''));
    if(ok)e.addEventListener('pointerdown',ev=>startDrag(ev,c,v,e));if(S.dragging===c)e.style.visibility='hidden';hd.appendChild(e)});
  fitHand();
  // actions
  const ac=$('actions');ac.innerHTML='';

function animateCards(snap,v,pv){
  if(!CFG.anim||S.dragging)return;

  const deckR=rectOf('#deckbox'),handR=rectOf('#hand'),oppR=i=>rectOf(`.opp[data-i="${i}"]`);
  const newEv=pv&&!fresh?v.evs.filter(e=>!pv.evs.some(x=>x.id===e.id)):[];
  const lastBoutEv=[...newEv].reverse().find(e=>e.type==='taken'||e.type==='beat');
  let k=0;
  document.querySelectorAll('#hand .card[data-c],#table .card[data-c]').forEach(e=>{
    const c=e.dataset.c,to=e.getBoundingClientRect();let from=fresh?null:snap.m.get(c),delay=0;
    if(!from){
      if(e.closest('#table')){const t=v.table.find(t=>t.a===c||t.d===c);const who=t&&t.a===c?t.by:v.defender;from=who===v.me?handR:(oppR(who)||deckR)}
      else{from=deckR;delay=(k++)*(fresh?90:70)}
    }
    if(!from)return;
    const dx=from.left+from.width/2-(to.left+to.width/2),dy=from.top+from.height/2-(to.top+to.height/2);
    if(Math.abs(dx)<2&&Math.abs(dy)<2)return;
    const known=snap.m.has(c);
    e.animate([{transform:`translate(${dx}px,${dy}px) scale(${known?1:.6})`,opacity:known?1:.4},{transform:'none',opacity:1}],{duration:430,delay,easing:'cubic-bezier(.2,.8,.2,1)',fill:'backwards'});
  });
  if(fresh)return;

  let gi=0;
  for(const t of pv.table)for(const c of [t.a,t.d]){
    if(!c||tableNow.has(c)||inHand.has(c))continue;const from=snap.m.get(c);if(!from)continue;
    let to,opt;
    if(lastBoutEv&&lastBoutEv.type==='taken'){to=oppR(pv.defender);opt={scale:.35}}
    else if(lastBoutEv&&lastBoutEv.type==='beat'){to={left:innerWidth+60,top:from.top-80,width:from.width,height:from.height};opt={scale:.8,rot:120+rnd(60),dur:650}}
    else{const caught=newEv.find(e=>e.type==='caught');to=caught?oppR(caught.by):deckR;opt={scale:.4}}
    if(!to)continue;opt.delay=(gi++)*45;flyGhost(cardEl(c),from,to,opt);
  }
  if(deckR)v.players.forEach((p,i)=>{if(i===v.me)return;const was=pv.players[i]?pv.players[i].count:p.count;
    const fromTable=lastBoutEv&&lastBoutEv.type==='taken'&&i===pv.defender?pv.table.reduce((s,t)=>s+(t.d?2:1),0):0;
    const add=Math.min(6,p.count-was-fromTable);const to=oppR(i);
    for(let j=0;j<add;j++){const b=document.createElement('div');b.className='cb';flyGhost(b,{left:deckR.left,top:deckR.top,width:deckR.width/2.1,height:deckR.height},to,{scale:.4,delay:200+j*80,dur:450})}});
}
function startDrag(ev,c,v,el){

  const L=v.legal;

  };

    const t=e.type==='pointercancel'?null:targetAt(e.clientX,e.clientY);

      else if(ht.length===1)a={type:'defend',card:c,idx:ht[0]};
      else if(tg.length===1)a={type:'defend',card:c,idx:tg[0]};
      else if(tg.length)toast('Перетащите карту на ту, которую бьёте')}
    const gr=drag.g.getBoundingClientRect();el=document.querySelector('#hand .card[data-c="'+c+'"]')||el;
    if(a){S.drop={c,r:gr,t:Date.now()};drag.g.remove();S.sel=null;send(a);

    else{const r=el.getBoundingClientRect();drag.g.animate([{transform:'rotate(-5deg) scale(1.1)'},{transform:`translate(${r.left-gr.left}px,${r.top-gr.top}px)`}],{duration:250,easing:'ease-out'}).onfinish=()=>{drag.g.remove();el.style.visibility=''};
      document.querySelectorAll('#table .pair').forEach(p=>p.classList.remove('target','cheatT'))}
  };

}

function splatSvg(size){let p='';const n=14;for(let k=0;k<n;k++){const a=Math.PI*2*k/n,r=size*(.32+Math.random()*.18);p+=(k?'L':'M')+(size/2+Math.cos(a)*r).toFixed(1)+' '+(size/2+Math.sin(a)*r).toFixed(1)}
  let drops='';for(let k=0;k<6;k++){const a=Math.random()*6.28,r=size*(.45+Math.random()*.1);drops+=`<circle cx="${(size/2+Math.cos(a)*r).toFixed(1)}" cy="${(size/2+Math.sin(a)*r).toFixed(1)}" r="${(size*.03+Math.random()*size*.04).toFixed(1)}" fill="#d62828"/>`}
  const s=new DOMParser().parseFromString(`<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><path d="${p}Z" fill="#d62828"/><ellipse cx="${size*.42}" cy="${size*.4}" rx="${size*.12}" ry="${size*.07}" fill="#ff8a80" opacity=".7"/>${drops}<circle cx="${size*.55}" cy="${size*.55}" r="${size*.03}" fill="#f9e79f"/><circle cx="${size*.47}" cy="${size*.6}" r="${size*.025}" fill="#f9e79f"/></svg>`,'image/svg+xml').documentElement;
  return document.importNode(s,true)}
function holeSvg(size){const s=new DOMParser().parseFromString(`<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 100 100"><g stroke="#fff" stroke-width="2" opacity=".85" fill="none"><path d="M50 50L12 30M50 50L85 18M50 50L92 62M50 50L60 95M50 50L18 80M50 50L35 5"/><path d="M30 40L22 52M70 32L78 44M72 68L60 78M34 70L26 60"/></g><circle cx="50" cy="50" r="11" fill="#111"/><circle cx="50" cy="50" r="14" fill="none" stroke="#666" stroke-width="3"/></svg>`,'image/svg+xml').documentElement;return document.importNode(s,true)}
function shakeEl(el,amp){el&&el.animate([0,1,2,3,4,5].map(()=>({transform:`translate(${rnd(amp*2)-amp}px,${rnd(amp*2)-amp}px)`})).concat([{transform:'none'}]),{duration:420})}
const CAT_SVG='data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 96"><g fill="#f4a340"><path d="M24 52 Q4 44 10 20" stroke="#f4a340" stroke-width="9" fill="none" stroke-linecap="round"/>
<g><ellipse cx="44" cy="74" rx="7" ry="13"><animateTransform attributeName="transform" type="rotate" values="-25 44 64;25 44 64;-25 44 64" dur=".35s" repeatCount="indefinite"/></ellipse>
<ellipse cx="80" cy="74" rx="7" ry="13"><animateTransform attributeName="transform" type="rotate" values="25 80 64;-25 80 64;25 80 64" dur=".35s" repeatCount="indefinite"/></ellipse></g>
<ellipse cx="62" cy="56" rx="40" ry="25"/><circle cx="100" cy="38" r="22"/><path d="M84 24 L86 4 L97 19 Z"/><path d="M104 18 L116 4 L118 27 Z"/></g>
<ellipse cx="66" cy="64" rx="24" ry="12" fill="#fbd9a6"/><path d="M89 21 L89 11 L94 18Z M108 19 L114 11 L114 23Z" fill="#f8a5b5"/>
<path d="M50 34 q5 8 0 15 M62 32 q5 8 0 17 M74 34 q5 8 0 15" stroke="#d9822b" stroke-width="3.5" fill="none" stroke-linecap="round"/>
<circle cx="95" cy="36" r="3.4" fill="#222"/><circle cx="108" cy="36" r="3.4" fill="#222"/><circle cx="96" cy="35" r="1" fill="#fff"/><circle cx="109" cy="35" r="1" fill="#fff"/>
<path d="M99 43 l3 3 l3 -3z" fill="#e75480"/><path d="M102 46 q-3 4 -6 2 M102 46 q3 4 6 2" stroke="#333" stroke-width="1.5" fill="none"/>
<path d="M90 44 l-14 -2 M90 47 l-13 3 M114 44 l14 -2 M114 47 l13 3" stroke="#333" stroke-width="1.2"/></svg>`);
function playFx(e,m){
  if(!CFG.fun)return;const v=m.view;if(!v)return;
  const nm=i=>v.players[i]?v.players[i].name:'';
  if(e.kind==='tomato'){
    const a=seatRect(e.from,m),b=seatRect(e.target,m);if(!a||!b)return;sfx('whoosh');
    const t=fxEl('🍅',a.x,a.y,b.me?54:40);
    arc(t,a,b,650,140,540).onfinish=()=>{t.remove();sfx('splat');
      const size=b.me?190:80,jx=rnd(40)-20,jy=rnd(20)-10;
      const s=fxEl(splatSvg(size),b.x+jx,b.y+jy);
      s.animate([{transform:'translate(-50%,-50%) scale(.2)'},{transform:'translate(-50%,-50%) scale(1.15)'},{transform:'translate(-50%,-50%) scale(1)'}],{duration:220,fill:'forwards'});
      setTimeout(()=>s.animate([{opacity:1,transform:'translate(-50%,-50%)'},{opacity:0,transform:'translate(-50%,-30%) scaleY(1.3)'}],{duration:b.me?2500:1800,fill:'forwards'}).onfinish=()=>s.remove(),b.me?2200:3500);
      shakeEl(b.el||$('hand'),b.me?10:6);
      if(b.me)toast('🍅 '+nm(e.from)+' попал в вас помидором!')};
  }else if(e.kind==='shot'){
    const a=seatRect(e.from,m),b=seatRect(e.target,m);if(!a||!b)return;sfx('bang');
    const g=fxEl('🔫',a.x,a.y,46);g.style.transform='translate(-50%,-50%)'+(b.x<a.x?' scaleX(-1)':'');
    g.animate([{opacity:0},{opacity:1,offset:.15},{opacity:1,offset:.7},{opacity:0}],{duration:900,fill:'forwards'}).onfinish=()=>g.remove();
    const len=Math.hypot(b.x-a.x,b.y-a.y),ang=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;
    const tr=document.createElement('div');tr.className='fxe';Object.assign(tr.style,{left:a.x+'px',top:a.y+'px',width:len+'px',height:'3px',background:'linear-gradient(90deg,#fff8,#ffeb3b)',transformOrigin:'0 50%',transform:`rotate(${ang}deg)`});$('fx').appendChild(tr);
    tr.animate([{opacity:1},{opacity:0}],{duration:250,fill:'forwards'}).onfinish=()=>tr.remove();
    const bah=fxEl('БАХ!',b.x+20,b.y-30,b.me?64:38);Object.assign(bah.style,{fontWeight:900,color:'#ffeb3b',textShadow:'3px 3px 0 #000'});
    bah.animate([{transform:'translate(-50%,-50%) scale(.3)'},{transform:'translate(-50%,-50%) scale(1.2)',offset:.3},{transform:'translate(-50%,-50%) scale(1)',opacity:1,offset:.8},{transform:'translate(-50%,-50%) scale(1)',opacity:0}],{duration:1100,fill:'forwards'}).onfinish=()=>bah.remove();
    const hx=b.me?rnd(innerWidth*.6)+innerWidth*.2:b.x+rnd(30)-15,hy=b.me?rnd(innerHeight*.5)+innerHeight*.2:b.y+rnd(20)-10;
    const hole=fxEl(holeSvg(b.me?220:60),hx,hy);
    setTimeout(()=>hole.animate([{opacity:1},{opacity:0}],{duration:1500,fill:'forwards'}).onfinish=()=>hole.remove(),b.me?2500:5000);
    shakeEl(b.me?$('game'):b.el,b.me?16:9);
    if(b.me)toast('🔫 '+nm(e.from)+' выстрелил в вас!');else if(e.from!==m.you)toast('🔫 '+nm(e.from)+' стреляет в '+nm(e.target)+'!');
  }else if(e.kind==='runner'){
    const mid=$('mid').getBoundingClientRect();if(!mid.height)return;
    const d=document.createElement('div');d.className='runner';const im=new Image();im.alt='';im.draggable=false;
    const url=v.opts.runnerImg;im.src=url&&/^https:\/\//.test(url)?url:CAT_SVG;im.onerror=()=>{if(im.src!==CAT_SVG)im.src=CAT_SVG};
    d.appendChild(im);const y=mid.top+12+e.y*Math.max(10,mid.height-110);
    Object.assign(d.style,{left:'0px',top:y+'px'});$('fx').appendChild(d);
    const from=e.dir>0?-160:innerWidth+40,to=e.dir>0?innerWidth+40:-160,flip=e.dir>0?'':' scaleX(-1)';
    let anim=d.animate([{transform:`translateX(${from}px)${flip}`},{transform:`translateX(${to}px)${flip}`}],{duration:e.speed||7000,easing:'linear',fill:'forwards'});
    anim.onfinish=()=>d.remove();
    if(Math.random()<.5)sfx('meow');
    d.onclick=ev=>{sfx('meow');for(let k=0;k<6;k++){const hz=fxEl(R(['💕','✨','💖']),ev.clientX,ev.clientY,24);
      hz.animate([{transform:'translate(-50%,-50%)',opacity:1},{transform:`translate(calc(-50% + ${rnd(120)-60}px),calc(-50% - ${60+rnd(60)}px))`,opacity:0}],{duration:900}).onfinish=()=>hz.remove()}
      anim.playbackRate=2.2};
  }
}

/* ===================== chat ===================== */
const CH={open:false,unread:0,seen:null,gid:null,evSeen:0};
function sendChat(text,react){
  const m={t:'chat',text,react};
  if(S.role==='host')hostChat(0,m);else if(conn&&conn.open)conn.send(m);else toast('Нет связи')
}
function processIncoming(m){
  // game events
  const v=m.view;
  if(!v&&CH.gid===null)CH.gid='lobby';
  if(v){
    if(CH.gid===null){CH.gid=v.gid;CH.evSeen=v.evs.length?v.evs[v.evs.length-1].id:0}
    else{if(v.gid!==CH.gid){CH.gid=v.gid;CH.evSeen=0}
      for(const e of v.evs)if(e.id>CH.evSeen){CH.evSeen=e.id;playEvent(e,v)}}
  }
  // chat
  const list=m.chat||[];
  const lastId=list.length?list[list.length-1].id:0;
  if(CH.seen===null||lastId<CH.seen){CH.seen=lastId;renderChat(list);return}
  for(const c of list)if(c.id>CH.seen){
    CH.seen=c.id;
    if(c.react&&REACT_FX[c.react])REACT_FX[c.react]();
    if(c.who!==m.you){if(!c.react)sfx('blip');if(!CH.open)CH.unread++;
      if(!CH.open&&c.text)toast(c.name+': '+c.text)}
  }
  renderChat(list);
}
function renderChat(list){
  const L=$('chatLog');L.innerHTML='';
  for(const c of list){const d=document.createElement('div');const b=document.createElement('b');b.textContent=c.name+': ';d.appendChild(b);
    d.appendChild(document.createTextNode(c.react?(REACT_BTNS.find(r=>r[0]===c.react)||['',''])[1]+' (реакция)':c.text));L.appendChild(d)}
  L.scrollTop=L.scrollHeight;renderTools();
}
function renderTools(){
  const inRoom=!!S.role;
  $('tMusic').textContent=CFG.music?'🎵':'🔇';$('tMusic').title=CFG.music?'Музыка вкл':'Музыка выкл';
  $('tSound').textContent=CFG.sound?'🔊':'🔈';$('tSound').classList.toggle('off',!CFG.sound);
  $('tMusic').classList.toggle('off',!CFG.music);
  $('tChat').style.display=inRoom?'':'none';$('tLink').style.display=inRoom?'':'none';$('tLeave').style.display=inRoom?'':'none';
  $('tChat').dataset.badge=CH.unread||'';
  $('chat').classList.toggle('on',CH.open&&inRoom);
}

/* ===================== wiring ===================== */
function renderMP(){$('mpAnim').checked=CFG.anim;$('mpFun').checked=CFG.fun;$('mpOn').checked=CFG.music;$('mpSndOn').checked=CFG.sound;$('mpVol').value=Math.round(CFG.mvol*100);$('mpSnd').value=Math.round(CFG.svol*100);
  $('mpVolV').textContent=Math.round(CFG.mvol*100)+'%';$('mpSndV').textContent=Math.round(CFG.svol*100)+'%';
  if(!$('mpTrack').textContent&&MU.list.length)$('mpTrack').textContent='♪ '+MU.list[MU.k].t}
$('mpIos').style.display=/iPhone|iPad|iPod/.test(navigator.userAgent)?'block':'none';
$('tMusic').onclick=()=>{const p=$('musicPanel');const on=!p.classList.contains('on');p.classList.toggle('on',on);if(on){CH.open=false;renderTools();renderMP()}};
$('mpAnim').onchange=e=>{CFG.anim=e.target.checked;saveCfg()};
$('mpFun').onchange=e=>{CFG.fun=e.target.checked;saveCfg();if(!CFG.fun)$('fx').innerHTML=''};
$('mpClose').onclick=()=>$('musicPanel').classList.remove('on');
$('mpOn').onchange=e=>{CFG.music=e.target.checked;MU.started=true;saveCfg();musicSync()};
$('mpSndOn').onchange=e=>{CFG.sound=e.target.checked;saveCfg();sfx('blip')};
$('mpVol').oninput=e=>{CFG.mvol=e.target.value/100;MU.el.volume=CFG.mvol;$('mpVolV').textContent=e.target.value+'%';
  if(CFG.mvol>0&&!CFG.music){CFG.music=true;MU.started=true;musicSync();$('mpOn').checked=true}saveCfg()};
$('mpSnd').oninput=e=>{CFG.svol=e.target.value/100;$('mpSndV').textContent=e.target.value+'%';if(AU.out)AU.out.gain.value=CFG.svol*.75;saveCfg()};
$('mpSnd').onchange=()=>sfx('slap');
$('mpNext').onclick=()=>{CFG.music=true;MU.started=true;saveCfg();nextTrack(1);renderMP()};
$('mpPrev').onclick=()=>{CFG.music=true;MU.started=true;saveCfg();nextTrack(-1);renderMP()};
$('mpPlay').onclick=()=>{CFG.music=!CFG.music;MU.started=true;saveCfg();musicSync();renderMP()};
$('tSound').onclick=()=>{CFG.sound=!CFG.sound;saveCfg();sfx('blip');toast(CFG.sound?'Звуки включены':'Звуки выключены')};
$('tChat').onclick=()=>{CH.open=!CH.open;$('musicPanel').classList.remove('on');if(CH.open){CH.unread=0;setTimeout(()=>$('chatIn').focus(),50)}renderTools()};
$('chatClose').onclick=()=>{CH.open=false;renderTools()};
$('chatForm').onsubmit=e=>{e.preventDefault();const t=$('chatIn').value.trim();if(t){sendChat(t,null);$('chatIn').value=''}};
$('chatReacts').innerHTML=REACT_BTNS.map(([k,e])=>`<button type="button" class="sec" data-r="${k}">${e}</button>`).join('');
$('chatReacts').onclick=e=>{const k=e.target.closest('button')?.dataset.r;if(k)sendChat('',k)};
renderTools();
$('name').value=ME.name;
function needName(){const n=$('name').value.trim();if(!n){toast('Введите имя');$('name').focus();return false}ME.name=n.slice(0,16);localStorage.setItem('durak_name',ME.name);return true}
const hashCode=()=>location.hash.replace('#','').toUpperCase().replace(/[^A-Z0-9]/g,'');
function initMenu(){
  const code=hashCode(),saved=loadHost();
  if(saved&&saved.code===code&&code){$('name').value=ME.name||'Хозяин';if(ME.name){startHost(saved);return}}
  $('btnResume').style.display=saved?'inline-block':'none';
  if(code&&!(saved&&saved.code===code)){$('joinRow').style.display='flex';$('joinCode').textContent=code;
    if(ME.name){startGuest(code);return}}
  show('menu');
}
$('btnCreate').onclick=()=>{if(needName()){localStorage.removeItem('durak_host');startHost(null)}};
$('btnResume').onclick=()=>{if(needName())startHost(loadHost())};
$('btnJoin').onclick=()=>{if(needName())startGuest(hashCode())};
$('btnCopy').onclick=copyLink;$('tLink').onclick=copyLink;
$('tLeave').onclick=()=>{if(confirm('Выйти из игры?')){location.hash='';location.reload()}};
$('btnBot').onclick=()=>send({type:'lobby',op:'bot'});
$('btnStart').onclick=()=>send({type:'lobby',op:'start'});
$('lSeats').onclick=e=>{const k=e.target.dataset.kick;if(k)send({type:'lobby',op:'kick',i:+k})};
for(const[id,k]of[['oMode','mode'],['oDeck','deck'],['oThrow','throwIn'],['oTeams','teams']])$(id).onchange=e=>send({type:'lobby',op:'opt',k,v:k==='teams'?+e.target.value:e.target.value});
$('oFirst5').onchange=e=>send({type:'lobby',op:'opt',k:'first5',v:e.target.checked});
$('oShow').onchange=e=>send({type:'lobby',op:'opt',k:'trumpShow',v:e.target.checked});
for(const[id,k]of[['oTomato','tomatoes'],['oPistol','pistol'],['oRunner','runner']])$(id).onchange=e=>send({type:'lobby',op:'opt',k,v:e.target.checked});
$('oRunnerImg').onchange=e=>{const u=e.target.value.trim();if(u&&!/^https:\/\//.test(u))toast('Нужна ссылка, начинающаяся с https://');send({type:'lobby',op:'opt',k:'runnerImg',v:u})};
$('oBots').onchange=e=>send({type:'lobby',op:'opt',k:'bots',v:e.target.value});
$('oCheat').onchange=e=>send({type:'lobby',op:'opt',k:'cheat',v:e.target.checked});
window.addEventListener('hashchange',()=>{if(!S.role)initMenu()});
initMenu();
</script>
